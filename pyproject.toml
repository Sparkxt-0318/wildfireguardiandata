[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "firewitness"
version = "0.1.0.dev0"
description = "Wildfire data labelling and cleaning tool"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
records = ["numpy", "pandas", "pyarrow", "scipy", "pyproj", "shapely", "requests"]
caught = ["numpy", "pandas", "pyarrow", "scipy", "pyproj", "shapely", "geopandas", "rasterio", "pystac-client", "planetary-computer", "requests"]
dev = ["pytest", "numpy", "pandas"]

[project.scripts]
firewitness = "firewitness.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["firewitness*"]

[tool.setuptools.package-data]
firewitness = ["*/config/*.json", "*/data/*"]
