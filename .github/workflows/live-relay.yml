name: live — firewitness detector (every 5-min GOES cycle, relay)

# protocol/LIVE_PROTOCOL.md §8 (track 51). One job runs the live detector for about 5 h 30 min, one record per 5-min
# GOES CONUS cycle, each signed (Sigstore keyless, GitHub OIDC) and committed to branch live-log before any outcome
# is known; then it dispatches its successor. A successor resumes from the state file in live-log and catches up any
# missed cycle (data stay on NOAA S3), so the log has one record per cycle. The 2-hourly cron is only a restart backup:
# with the concurrency group, at most one run is active and one pending. Same pattern as the wildfireguardian live
# relay (its PR #213). To stop: disable this workflow in the Actions tab.

on:
  workflow_dispatch:
    inputs:
      trigger:
        description: 'who started the run (relay | manual | schedule)'
        default: manual
  schedule:
    - cron: '23 */2 * * *'

permissions:
  contents: write     # commit records to live-log
  id-token: write     # Sigstore keyless signing
  actions: write      # dispatch the successor

concurrency:
  group: firewitness-live
  cancel-in-progress: false

jobs:
  run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: python -m pip install -e . numpy scipy h5py requests sigstore==4.5.1

      - name: Check out (or create) the live-log branch
        run: |
          set -e
          git config --global user.name "firewitness-live[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=50 origin live-log; then
            git worktree add live-log-wt FETCH_HEAD
            cd live-log-wt && git checkout -B live-log
          else
            git worktree add --detach live-log-wt
            cd live-log-wt && git checkout --orphan live-log && git rm -rfq . && mkdir -p live
            printf '# live-log\n\nSigned prospective log of the firewitness live detector (track 51). One JSON record per 5-min GOES cycle in live/log/YYYY/MM/DD/, its Sigstore bundle next to it, reconciliation files in live/reconcile/. Records are never edited.\n' > README.md
            git add README.md && git commit -qm "live-log: start" && git push origin live-log
          fi

      - name: Live loop (about 5 h 30 min)
        env:
          LIVE_TRIGGER: ${{ inputs.trigger || github.event_name }}
          FIREWITNESS_RAW: ${{ github.workspace }}/live-cache/raw
        run: python -m firewitness live run --log-repo live-log-wt --hours 5.5 --cache live-cache --publish

      - name: Start the successor
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$REPO/actions/workflows/live-relay.yml/dispatches" \
            -d '{"ref":"main","inputs":{"trigger":"relay"}}')
          echo "dispatch successor -> HTTP $code"
          [ "$code" = "204" ] || { echo "::error::successor not started (HTTP $code); the 2-hourly cron restarts the chain"; exit 1; }
